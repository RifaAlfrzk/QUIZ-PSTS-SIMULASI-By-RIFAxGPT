const currentScore =
    document.getElementById("currentScore");


/* =========================
   START QUIZ
========================= */

function startQuiz() {

    currentQuestion = 0;

    score = 0;

    selectedAnswer = null;


    lobbyPage.classList.remove("active");

    resultPage.classList.remove("active");

    quizPage.classList.add("active");


    showQuestion();

}


/* =========================
   SHOW QUESTION
========================= */

function showQuestion() {

    selectedAnswer = null;


    const question =
        questions[currentQuestion];


    /* NUMBER */

    questionNumber.textContent =
        "Soal " +
        (currentQuestion + 1) +
        " / " +
        questions.length;


    /* SCORE */

    currentScore.textContent =
        score;


    /* QUESTION */

    questionText.textContent =
        question.question;


    /* PROGRESS */

    const progress =
        ((currentQuestion + 1) /
        questions.length) * 100;

    progressBar.style.width =
        progress + "%";


    /* CLEAR ANSWERS */

    answersContainer.innerHTML = "";


    /* CREATE ANSWERS */

    question.answers.forEach(
        function(answer, index) {


            const button =
                document.createElement("button");


            button.className =
                "answer-button";


            button.textContent =
                String.fromCharCode(65 + index)
                + ". "
                + answer;


            button.onclick =
                function() {

                    selectAnswer(
                        index,
                        button
                    );

                };


            answersContainer.appendChild(
                button
            );

        }
    );


    /* DISABLE NEXT */

    nextButton.disabled = true;

}


/* =========================
   SELECT ANSWER
========================= */

function selectAnswer(index, button) {

    selectedAnswer = index;


    /* REMOVE SELECTED */

    const allButtons =
        document.querySelectorAll(
            ".answer-button"
        );


    allButtons.forEach(
        function(btn) {

            btn.classList.remove(
                "selected"
            );

        }
    );


    /* SELECT CURRENT */

    button.classList.add(
        "selected"
    );


    /* ENABLE NEXT */

    nextButton.disabled = false;

}


/* =========================
   NEXT QUESTION
========================= */

nextButton.onclick =
function() {


    /* CEK JAWABAN */

    if (
        selectedAnswer ===
        questions[currentQuestion].correct
    ) {

        score++;

    }


    currentQuestion++;


    /* MASIH ADA SOAL */

    if (
        currentQuestion <
        questions.length
    ) {

        showQuestion();

    }

    /* SELESAI */

    else {

        showResult();

    }

};


/* =========================
   SHOW RESULT
========================= */

function showResult() {


    /* HIDE QUIZ */

    quizPage.classList.remove(
        "active"
    );


    /* SHOW RESULT */

    resultPage.classList.add(
        "active"
    );


    /* CALCULATE */

    const total =
        questions.length;


    const percentage =
        Math.round(
            (score / total) * 100
        );


    const wrong =
        total - score;


    /* DISPLAY */

    document.getElementById(
        "finalScore"
    ).textContent =
        percentage;


    document.getElementById(
        "correctResult"
    ).textContent =
        score;


    document.getElementById(
        "wrongResult"
    ).textContent =
        wrong;

}


/* =========================
   RESTART
========================= */

function restartQuiz() {


    /* RESET */

    currentQuestion = 0;

    score = 0;

    selectedAnswer = null;


    /* HIDE RESULT */

    resultPage.classList.remove(
        "active"
    );


    /* SHOW LOBBY */

    lobbyPage.classList.add(
        "active"
    );

}


</script>
